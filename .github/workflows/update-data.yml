name: Daily data refresh

on:
  schedule:
    # 11:30 UTC = 6:30am Central (CDT) / 5:30am Central (CST)
    - cron: '30 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd

      - name: Fetch latest data and update the dashboard
        run: python scripts/update_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "jet-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Automated daily data refresh"
            git push
          fi
